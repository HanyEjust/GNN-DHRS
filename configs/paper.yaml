project:
  name: GNN-DHRS
  output_dir: outputs

datasets:
  DF-1:
    path: data/raw/DF-1.csv
    target: stroke
    id_candidates: [id, ID, patient_id]
    source: "UCI-derived/Analytics Vidhya train_2v-style stroke benchmark; verify against manuscript citation"
  DF-2:
    path: data/raw/DF-2.csv
    target: stroke
    id_candidates: [id, ID, patient_id]
    source: "https://www.kaggle.com/datasets/zzettrkalpakbal/full-filled-brain-stroke-dataset"
  DF-3:
    path: data/raw/DF-3.csv
    target: stroke
    id_candidates: [id, ID, patient_id]
    source: "https://www.kaggle.com/datasets/fedesoriano/stroke-prediction-dataset"

cv:
  outer_folds: 10
  inner_folds: 5
  split_seed: 11
  seeds: [11, 22, 33, 44, 55]

preprocessing:
  corr_threshold: 0.90
  feature_counts: [5, 10, 15, all]
  selected_feature_count: 10

dhrs:
  oversampling_ratio: 1.0
  borderline_k_neighbors: 5
  borderline_m_neighbors: 10
  smoteenn_smote_k_neighbors: 5
  enn_neighbors: 3
  categorical_projection: argmax

graph:
  metric: cosine
  k: 10
  positive_only: true
  directed: true
  self_loop_weight: 1.0
  test_reference: original_training_only

model:
  layers: 2
  hidden_dim: 128
  heads: 8
  dropout: 0.30
  leaky_relu_slope: 0.20

training:
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0005
  betas: [0.9, 0.999]
  eps: 1.0e-8
  max_epochs: 200
  scheduler_factor: 0.50
  scheduler_patience: 10
  min_lr: 1.0e-6
  early_stopping_patience: 20
  monitor: f1

threshold:
  candidates: [0.10,0.20,0.30,0.40,0.50,0.60,0.70,0.80,0.90]

calibration:
  ece_bins: 10

explainability:
  shap_background: 100
  shap_background_per_class: 50
  shap_test_per_fold: 20
  shap_test_per_class: 10
  shap_nsamples: 256
  edge_budget: 5
  perturbations: 10
  random_edge_repeats: 10

sensitivity:
  heads: [2,4,8,12]
  hidden_dim: [32,64,128,256]
  dropout: [0.10,0.30,0.50,0.70]
  lr: [0.0001,0.0005,0.001,0.005]
  weight_decay: [0.0001,0.0005,0.001]
  oversampling_ratio: [0.50,0.75,1.00,1.25]
  graph_k: [5,10,15,20,25]

robustness:
  missingness: [0.0,0.10,0.20,0.30]
  gaussian_noise_sigma: [0.0,0.05,0.10,0.20]
  prevalence_multiplier: [0.5,1.0,2.0]
  edge_corruption: [0.0,0.10,0.20,0.30]

selective_prediction:
  coverages: [1.0,0.95,0.90,0.80,0.70]
